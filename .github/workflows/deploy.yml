name: Deploy to Jelou Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Jelou CLI
        run: npm install -g @jelou/cli@1.75.0

      - name: Authenticate
        run: jelou login --token "$JELOU_TOKEN" --profile ci --skip-skills
        env:
          JELOU_TOKEN: ${{ secrets.JELOU_TOKEN }}

      - name: Deploy
        run: jelou functions deploy --no-confirm --json
